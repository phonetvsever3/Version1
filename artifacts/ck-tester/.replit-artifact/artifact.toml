kind = "web"
previewPath = "/"
title = "CKLottery Tester"
version = "1.0.0"
id = "artifacts/ck-tester"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22340

[services.development]
run = "pnpm --filter @workspace/ck-tester run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ck-tester", "run", "build" ]
publicDir = "artifacts/ck-tester/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22340"
BASE_PATH = "/"
