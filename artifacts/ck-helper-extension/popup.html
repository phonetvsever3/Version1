<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CK Helper</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 340px;
    min-height: 200px;
    background: #0f0f0f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    padding: 16px;
  }
  h2 {
    font-size: 15px;
    font-weight: 700;
    color: #facc15;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .field {
    margin-bottom: 10px;
  }
  .label {
    font-size: 10px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .row {
    display: flex;
    gap: 6px;
    align-items: stretch;
  }
  .value {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11px;
    color: #aaa;
    font-family: monospace;
    word-break: break-all;
    max-height: 64px;
    overflow-y: auto;
    line-height: 1.4;
  }
  .value.found { color: #86efac; border-color: #166534; }
  .value.missing { color: #f87171; border-color: #7f1d1d; font-style: italic; }
  button.copy {
    background: #2563eb;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 0 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  button.copy:hover { background: #1d4ed8; }
  button.copy:active { background: #1e40af; }
  button.copy.copied { background: #16a34a; }
  button.copy:disabled { background: #374151; cursor: not-allowed; }
  .divider {
    border: none;
    border-top: 1px solid #222;
    margin: 12px 0;
  }
  .btn-scan {
    width: 100%;
    background: linear-gradient(135deg, #f97316, #facc15);
    border: none;
    border-radius: 10px;
    color: #000;
    font-size: 13px;
    font-weight: 700;
    padding: 10px;
    cursor: pointer;
    margin-bottom: 14px;
    transition: opacity 0.15s;
  }
  .btn-scan:hover { opacity: 0.9; }
  .btn-scan:active { opacity: 0.75; }
  .json-box {
    background: #111;
    border: 1px solid #1d4ed8;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 10px;
    color: #60a5fa;
    font-family: monospace;
    word-break: break-all;
    line-height: 1.5;
  }
  .note {
    font-size: 10px;
    color: #555;
    margin-top: 8px;
    line-height: 1.5;
  }
  .status {
    font-size: 11px;
    color: #888;
    text-align: center;
    padding: 8px 0;
  }
</style>
</head>
<body>
<h2>🎰 CK Helper</h2>

<button class="btn-scan" id="btnScan">🔍 Scan current tab</button>

<div class="field">
  <div class="label">cf_clearance (cookie)</div>
  <div class="row">
    <div class="value missing" id="valCf">Not found</div>
    <button class="copy" id="copyCf" disabled>Copy</button>
  </div>
</div>

<div class="field">
  <div class="label">token (localStorage)</div>
  <div class="row">
    <div class="value missing" id="valToken">Not found</div>
    <button class="copy" id="copyToken" disabled>Copy</button>
  </div>
</div>

<div class="field">
  <div class="label">tokenHeader (localStorage)</div>
  <div class="row">
    <div class="value missing" id="valHeader">Not found</div>
    <button class="copy" id="copyHeader" disabled>Copy</button>
  </div>
</div>

<hr class="divider">

<div class="label" style="margin-bottom:6px;">JSON (paste into CK Tester session field)</div>
<div class="json-box" id="jsonOut">—</div>
<button class="copy" id="copyJson" style="width:100%;margin-top:6px;" disabled>Copy JSON</button>

<p class="note">Open <strong>cklottery.club</strong> or <strong>ckygjf6r.com</strong> first, log in, then tap Scan.</p>

<script src="popup.js"></script>
</body>
</html>
